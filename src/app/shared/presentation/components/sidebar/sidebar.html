<aside class="sidebar">
  <div class="sidebar__brand">
    <!-- The logo is drawn for dark backgrounds, so it sits on its own dark tile in both themes. -->
    <span class="sidebar__logo-tile">
      <img src="MOscuroSinBG.svg" alt="SpotTrack logo">
    </span>
    <span class="sidebar__brand-text">SpotTrack</span>
  </div>

  <nav class="sidebar__nav">
    @for (item of navItems; track item.path) {
      <a
        class="sidebar__item"
        [routerLink]="item.path"
        routerLinkActive="sidebar__item--active"
        (click)="linkClicked.emit()"
      >
        <mat-icon class="sidebar__icon">{{ item.icon }}</mat-icon>
        <span class="sidebar__label">{{ item.labelKey | translate }}</span>
      </a>
    }
  </nav>
</aside>
