<div class="user-profile">
  <button class="profile-link" routerLink="/profile">
    <div class="avatar">
      <span>{{ initials }}</span>
    </div>
    <div class="user-info">
      <span class="user-name">{{ currentUser()?.name }}</span>
      @if (primaryGymName()) {
        <span class="gym-name">{{ primaryGymName() }}</span>
      }
    </div>
  </button>
</div>
