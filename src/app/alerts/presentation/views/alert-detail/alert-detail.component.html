<div class="ad-page">

  <a routerLink="/alerts" class="ad-back">
    <mat-icon>arrow_back</mat-icon>
    {{ 'alerts.backToInbox' | translate }}
  </a>

  @if (alert; as a) {
    <div class="ad-card">
      <app-alert-reader [alert]="a" (deleted)="dismiss($event)" (opened)="navigateTo($event)"
                        (readToggled)="store.toggleRead($event)" />
    </div>
  } @else {
    <div class="ad-card ad-missing">
      <span class="ad-missing__icon"><mat-icon>search_off</mat-icon></span>
      <h3>{{ 'alerts.notFound' | translate }}</h3>
      <a routerLink="/alerts" class="ad-btn">{{ 'alerts.backToInbox' | translate }}</a>
    </div>
  }

</div>
